<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="topbar">
            <input type="text" id="search" placeholder="Search for Cards...">
            <button id="addColumn">Add column</button>
        </div>
        <div id="board">
            <div class="column" id="todo">
                <h2>Todo</h2>
                <h2>Todo <span class="count">0</span></h2>
                <button class="addCardBtn" data-column="todo">+ Add card</button>
                <button id="moveBtn"></button>
                <div class="cards"></div>
            </div>
            <div class="column" id="inprogress">
                <h2>In progress</h2>
                <h2>In progress <span class="count">0</span></h2>
                <button class="addCardBtn" data-column="inprogress">+ Add card</button>
                <button id="moveBtn"></button>
                <div class="cards"></div>
            </div>
            <div class="column" id="done">
                <h2>Completed</h2>
                <h2>Completed <span class="count">0</span></h2>
                <button class="addCardBtn" data-column="done">+ Add card</button>
                <button id="moveBtn"></button>
                <div class="cards"></div>
            </div>
        </div>
        <dialog id="cardDialog">
            <h3 id="dialogTitle"></h3>
            <textarea id="dialogDesc" placeholder="Add a description..."></textarea>
            <button id="saveDesc">Save</button>
            <button id="closeDialog">Close</button>
        </dialog>
        <script src="app.js"></script>
    </body>
</html>
